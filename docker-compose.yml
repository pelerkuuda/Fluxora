version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxora-db
    environment:
      POSTGRES_USER: fluxora
      POSTGRES_PASSWORD: fluxora
      POSTGRES_DB: fluxora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
